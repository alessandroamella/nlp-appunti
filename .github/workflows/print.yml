# Builds the printable PDFs (print/build.py) and publishes them on a rolling
# "latest" release, so the newest copy is always at the same link.
name: Print notes

on:
  push:
    branches: [master]
    paths: ["appunti/**", "print/**", ".github/workflows/print.yml"]
  workflow_dispatch:

concurrency:
  group: print
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # only the images the notes embed, not the slide/lab/exam PDFs
      - run: git lfs pull --include="appunti/assets/**"

      # pandoc from its GitHub release, fonts straight from upstream: no apt,
      # whose mirrors occasionally hang. Same fonts the local build picks.
      - name: Install pandoc and fonts
        timeout-minutes: 3
        run: |
          curl -fsSL -o pandoc.deb https://github.com/jgm/pandoc/releases/download/3.6.4/pandoc-3.6.4-1-amd64.deb
          sudo dpkg -i pandoc.deb
          dir=~/.local/share/fonts && mkdir -p $dir && cd $dir
          gf=https://github.com/google/fonts/raw/main/ofl
          for f in "inter/Inter[opsz,wght].ttf" "inter/Inter-Italic[opsz,wght].ttf" \
                   "notoserif/NotoSerif[wdth,wght].ttf" "notoserif/NotoSerif-Italic[wdth,wght].ttf" \
                   "notosansmono/NotoSansMono[wdth,wght].ttf" "notocoloremoji/NotoColorEmoji-Regular.ttf"; do
            curl -fsSL -o "$(basename "$f")" "$gf/$(echo "$f" | sed 's/\[/%5B/; s/\]/%5D/')"
          done
          curl -fsSL -O https://mirrors.ctan.org/fonts/lm-math/opentype/latinmodern-math.otf
          fc-cache -f

      - run: python3 print/build.py
        env:
          CHROME: google-chrome

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # spaces in asset names become dots on GitHub: give the combined one a clean name
          mv "print/pdf/NLP - all notes.pdf" print/pdf/nlp-all-notes.pdf
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest print/pdf/*.pdf \
            --target "$GITHUB_SHA" \
            --title "Notes ($(date -u +%F))" \
            --notes "Built from ${GITHUB_SHA::7}. Combined PDF: nlp-all-notes.pdf"
